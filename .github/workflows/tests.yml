# The test suite, on every push and pull request.
#
# The suite is deliberately runnable with nothing but the declared
# dependencies: no capture data, no rendered frames, no ffmpeg. Where a test
# needs real measurements it reads them from tests/data, which holds ANGLES
# extracted from the runs rather than the hundreds of gigabytes they came from.
# See tools/make_cusp_fixture.py.

name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project declares (tomllib), and the numeric
        # results are checked on both a Linux and a Windows runner because the
        # tolerances here are numerical and the work is done on Windows.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project and its test dependencies
        # pytest is in the `dev` dependency-group, which `uv sync` installs by
        # default; uv.lock is committed, so this resolves to the same versions
        # everywhere.
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run the suite
        run: uv run --python ${{ matrix.python-version }} pytest -q
